<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111c" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="neonGlow512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff85" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00ff85" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="url(#neonGlow512)" stroke-width="10"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(0,255,133,0.15)" stroke-width="4"/>
  <!-- Soccer ball icon -->
  <g filter="url(#glow512)">
    <circle cx="256" cy="235" r="115" fill="#ffffff" stroke="#07090e" stroke-width="7"/>
    <!-- Pentagon in center -->
    <polygon points="256,188 288,214 278,252 234,252 224,214" fill="#07090e"/>
    <!-- Radiating seams -->
    <line x1="256" y1="188" x2="256" y2="130" stroke="#07090e" stroke-width="7"/>
    <line x1="288" y1="214" x2="340" y2="198" stroke="#07090e" stroke-width="7"/>
    <line x1="278" y1="252" x2="320" y2="300" stroke="#07090e" stroke-width="7"/>
    <line x1="234" y1="252" x2="192" y2="300" stroke="#07090e" stroke-width="7"/>
    <line x1="224" y1="214" x2="172" y2="198" stroke="#07090e" stroke-width="7"/>
  </g>
  <!-- LIGAPRO banner -->
  <rect x="70" y="380" width="372" height="62" rx="16" fill="#00ff85"/>
  <text x="256" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#07090e" text-anchor="middle" letter-spacing="4">LIGAPRO</text>
</svg>
